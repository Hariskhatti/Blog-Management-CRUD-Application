<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin: 10px 0 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0069d9;
        }

        .back-btn {
            margin-top: 10px;
            text-align: center;
        }

        .back-btn a {
            color: #007bff;
            text-decoration: none;
        }

        .back-btn a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Edit Blog</h2>

    <form th:action="@{/updateBlog}" th:object="${modelBlog}" method="post">
        <!-- Hidden field to hold ID -->
        <input type="hidden" th:field="*{id}" />

        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" placeholder="Enter blog title" required />

        <label for="content">Content</label>
        <textarea id="blog" th:field="*{blog}" placeholder="Enter blog content" required></textarea>

        <button type="submit">Save Changes</button>
    </form>

    <div class="back-btn">
        <a href="/admin/dashboard">← Back to Dashboard</a>
    </div>
</div>
</body>
</html>
