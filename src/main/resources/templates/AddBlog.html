<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add / Edit Blog</title>
    <style>
        /* -------------------- General Styles -------------------- */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea {
            min-height: 150px;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back-btn {
            margin-top: 15px;
            text-align: center;
        }

        .back-btn a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn a:hover {
            text-decoration: underline;
        }

        /* Optional: Responsive */
        @media(max-width: 768px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 th:text="${modelBlog.id} != null ? 'Edit Blog' : 'Add New Blog'">Add / Edit Blog</h2>

    <form th:action="@{${modelBlog.id} != null ? '/saveBlog' : '/updateBlog' }"
          th:object="${modelBlog}" method="post">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{id}" />

        <!-- Title -->
        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" placeholder="Enter blog title" required />

        <!-- Content -->
        <label for="blog">Blog Content</label>
        <textarea id="blog" th:field="*{blog}" placeholder="Enter blog content" required></textarea>

        <!-- Publish Date -->
        <label for="publishDate">Publish Date</label>
        <input type="date" id="publishDate" th:field="*{publishDate}" required />

        <!-- Submit Button -->
        <button type="submit" th:text="${modelBlog.id} != null ? 'Update Blog' : 'Save Blog'">Save Blog</button>
    </form>

    <div class="back-btn">
        <a href="/admin/dashboard">← Back to Dashboard</a>
    </div>
</div>

</body>
</html>
