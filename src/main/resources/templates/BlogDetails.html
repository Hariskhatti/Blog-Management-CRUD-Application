<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${blog.title}"></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 70%;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 5px;
            box-shadow: 0 0 5px #ccc;
        }

        .blog-title {
            font-size: 26px;
            font-weight: bold;
        }

        .blog-date {
            font-size: 12px;
            color: gray;
            margin-bottom: 15px;
        }

        .blog-content {
            font-size: 16px;
            line-height: 1.6;
        }

        .back-link {
            margin-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="blog-title" th:text="${blog.title}"></div>


    <hr>

    <div class="blog-content" th:text="${blog.blog}"></div>

    <a class="back-link" th:href="@{/}">← Back to Blogs</a>

</div>

</body>
</html>
